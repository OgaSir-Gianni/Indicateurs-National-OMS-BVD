name: refresh-data

on:
  schedule:
    # 06:00 and 14:00 UTC — early morning and mid-afternoon in Kinshasa/Bunia.
    - cron: "0 6,14 * * *"
  workflow_dispatch:
  push:
    paths:
      - "form/**"          # a re-published form should regenerate the registry
      - "config/**"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rebuild the indicator registry from the XLSForm
        run: python scripts/build_indicators.py

      - name: Download submissions from Ona
        env:
          ONA_TOKEN: ${{ secrets.ONA_TOKEN }}
          ONA_FORM_ID: ${{ vars.ONA_FORM_ID }}
          REDACT_EMAILS: "1"
          REDACT_NAMES: ${{ vars.REDACT_NAMES || '1' }}
        run: python scripts/fetch_data.py

      # Belt and braces. fetch_data.py already redacts by default, but docs/data
      # is published to a public URL, so re-check rather than trust that the
      # default survived an edit. Idempotent: a no-op when there is nothing left.
      - name: Redact respondent names before publishing
        env:
          REDACT_NAMES: ${{ vars.REDACT_NAMES || '1' }}
        run: python scripts/scrub_published.py

      - name: Commit the refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "No change in the data — nothing to commit."
          else
            git commit -m "data: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
